<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 25 1160 1075" role="img" aria-label="JALTRIX — clean shield emblem">
<title>JALTRIX — clean shield emblem</title>
<desc>Application variant derived from the owner-supplied JALTRIX shield. Exterior network-globe footer removed; shield, radar, nodes, lock and orbit preserved. Transparent native SVG.</desc>

