name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: python -m pip install 'PySide6==6.10.3' pytest setuptools ruff
      - run: QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software python -m pytest -q -ra
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python -m compileall -q src
      - run: python tools/build_deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: deb-python-${{ matrix.python }}
          path: dist/*.deb
# This checks the Python/QML runtime and builds a package. It does not certify
# distribution GUI compatibility or real Snort integration. Engine tests skip
# explicitly when no engine is installed. Real engine validation is separate.
