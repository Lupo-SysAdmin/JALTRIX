[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snort-soc-desktop"
version = "1.0.0"
description = "Consola de investigación para Snort 3"
license = {file = "LICENSE"}
authors = [{name = "Jan Herrera"}]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
snort-soc = "snort_soc.app:main"

[tool.setuptools.package-data]
snort_soc = ["ui/*.qml", "ui/*.png", "ui/*.svg", "legal/*.txt", "legal/*.json", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
